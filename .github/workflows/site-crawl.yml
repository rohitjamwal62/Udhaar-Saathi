# Crawls every public page of the PRODUCTION site once an hour and fails the run if any page is broken.
# Reads /sitemap.xml, follows internal links, skips private areas. See deploy/site_crawl.py.
# GitHub only runs scheduled workflows from the default branch (main).
name: hourly site crawl

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python deploy/site_crawl.py https://udhaarsaathi-api.onrender.com
