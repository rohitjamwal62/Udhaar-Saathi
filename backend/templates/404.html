{% load i18n %}{% load static %}<!doctype html>

<body>

  <p class="btn-row" style="justify-content:center"><a class="btn" href="{% url 'home' %}">{% trans "Go to the home page" %}</a><a class="btn btn-ghost" href="{% url 'contact' %}">{% trans "Contact us" %}</a></p>
