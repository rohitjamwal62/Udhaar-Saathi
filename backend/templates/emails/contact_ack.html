{% load i18n %}<div style="font-family:Arial,sans-serif;max-width:520px"><h3 style="color:#0B6E4F">{% blocktrans trimmed with site_name=site_name %}Thanks for writing to {{ site_name }}{% endblocktrans %}</h3><p>{% blocktrans trimmed with name=name subject=subject %}Hi {{ name }}, we received your message about <b>{{ subject }}</b> and will reply by email.{% endblocktrans %}</p></div>
