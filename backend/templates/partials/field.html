{% load i18n %}<div class="field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% if field.field.widget.input_type == 'password' %}<div class="pw">{{ field }}<button type="button" class="toggle" hidden aria-label="{% trans 'Show or hide password' %}" data-show="{% trans 'Show' %}" data-hide="{% trans 'Hide' %}">{% trans "Show" %}</button></div>{% else %}{{ field }}{% endif %}
  {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<ul class="errs" role="alert">{% for e in field.errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
</div>
