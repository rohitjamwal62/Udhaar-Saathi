{% load i18n %}{% get_current_language as CUR_LANG %}<form class="lang-switch{% if where %} {{ where }}{% endif %}" method="post" action="{% url 'set_language' %}" aria-label="{% trans 'Language' %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button type="submit" name="language" value="en" lang="en" title="English"{% if CUR_LANG == 'en' %} aria-current="true"{% endif %}>EN</button><span class="sep" aria-hidden="true">|</span><button type="submit" name="language" value="hi" lang="hi" title="हिन्दी"{% if CUR_LANG == 'hi' %} aria-current="true"{% endif %}>हिन्दी</button></form>
