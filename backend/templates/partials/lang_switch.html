{% load i18n %}{% get_current_language as CUR_LANG %}<div class="lang-switch{% if where %} {{ where }}{% endif %}" role="group" aria-label="{% trans 'Language' %}"><a href="{{ SEO.switch.en }}" hreflang="en" lang="en" title="English"{% if CUR_LANG == 'en' %} aria-current="true"{% endif %}>EN</a><span class="sep" aria-hidden="true">|</span><a href="{{ SEO.switch.hi }}" hreflang="hi" lang="hi" title="हिन्दी"{% if CUR_LANG == 'hi' %} aria-current="true"{% endif %}>हिन्दी</a></div>
