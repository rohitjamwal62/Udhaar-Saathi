# HAProxy (free, open source) in front of N identical copies of the LenDen Saathi app.
#
# What it does
#   * spreads requests over every healthy copy ("leastconn": the copy with the fewest open requests gets the next one),
#   * checks each copy every 3 s and stops sending to a sick one (3 failures out), puts it back after 2 good checks,
#   * finds copies by name (Docker DNS), so `docker compose up --scale app=8` adds capacity with no config change,
#   * decides the visitor's real address ITSELF and overwrites X-Forwarded-For (the app trusts it, see TRUSTED_PROXY_COUNT=1),
#   * rate-limits each address before a request reaches Django (cheap protection from floods and password guessing),
#   * compresses text responses.
#
# TLS: terminate HTTPS in front of this (Cloudflare's free plan, or Caddy on the same machine) and forward plain HTTP here.
#      If you use Cloudflare set BEHIND_CLOUDFLARE=1 and allow only Cloudflare's addresses to reach this port.

global
    log stdout format raw local0
    maxconn 20000
    hard-stop-after 30s

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-keep-alive
    option redispatch                 # if a copy dies mid-request, try another one
    retries 2
    timeout connect 5s
    timeout client 30s
    timeout server 65s                # a little above gunicorn's 60 s
    timeout http-request 10s          # slow-loris protection
    timeout http-keep-alive 15s
    timeout queue 20s

# Docker's built-in DNS: lets HAProxy discover the app copies as they are started and stopped.
resolvers docker
    nameserver dns1 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold other 5s
    hold refused 5s
    hold nx 5s
    hold timeout 5s
    hold obsolete 5s

# Counters for the stricter limit on sign-in style requests (one row per visitor address).
backend st_auth
    stick-table type ip size 200k expire 10m store http_req_rate(60s)

# Live status page. Published only on 127.0.0.1 by docker-compose.yml: http://127.0.0.1:8404/stats
frontend stats
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s

frontend web
    bind :80
    stick-table type ip size 500k expire 2m store http_req_rate(10s)

    # The real client address. Never trust a header the visitor sent: always overwrite it.
    acl behind_cloudflare env(BEHIND_CLOUDFLARE) -m str 1
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-For %[src] unless behind_cloudflare
    http-request set-header X-Forwarded-For %[req.hdr(CF-Connecting-IP)] if behind_cloudflare
    http-request set-header X-Forwarded-Proto https if { ssl_fc }

    # Per address limits (numbers come from the environment; see .env.example).
    http-request track-sc0 req.hdr_ip(X-Forwarded-For)
    http-request deny deny_status 429 content-type text/plain string "Too many requests. Please slow down.\n" if { sc_http_req_rate(0) gt "$RATE_PER_10S" }

    acl is_auth_path path_beg /login /register /verify /forgot-password /reset-password /api/v1/auth /admin/login
    acl is_post method POST
    http-request track-sc1 req.hdr_ip(X-Forwarded-For) table st_auth if is_auth_path is_post
    http-request deny deny_status 429 content-type text/plain string "Too many attempts. Please wait a minute.\n" if is_auth_path is_post { sc_http_req_rate(1,st_auth) gt "$AUTH_POSTS_PER_MIN" }

    compression algo gzip
    compression type text/html text/plain text/css text/javascript application/javascript application/json image/svg+xml

    default_backend app

backend app
    balance leastconn
    option httpchk
    http-check send meth GET uri /health/live ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server check inter 3s fall 3 rise 2 maxconn 200 slowstart 20s resolvers docker init-addr libc,none
    # up to 20 copies are found by their service name "app"; add more numbers here for a bigger fleet
    server-template app 1-20 app:8000
