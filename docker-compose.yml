# Local/dev stack (NOT yet run by the author of this file; verify before relying on it).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: udhaar_saathi
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5433:5432"]
  schema:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: python /app/database/create_tables.py
    environment: &env
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: udhaar_saathi
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
    depends_on: [db]
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment: *env
    ports: ["8000:8000"]
    depends_on: [schema]
volumes: { pgdata: {} }
