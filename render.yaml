# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo. See DEPLOY_RENDER.md.
services:
  - type: web
    name: udhaarsaathi-api
    runtime: python
    plan: free                    # free instances sleep after ~15 min idle; the first request then takes ~30-60 s
    region: singapore             # same region as the Neon database (ap-southeast-1) for the lowest latency
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true       # Render creates a strong random key; never commit one
      - key: DATABASE_URL         # your Neon connection string: paste it in the Render dashboard (kept secret)
        sync: false
      - key: PAYMENT_GATEWAY
        value: razorpay
      - key: RAZORPAY_KEY_ID      # optional until you take real payments
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: OTP_SENDER
        value: console
      # TEST DEPLOYMENT ONLY: prints each sign-up OTP in the Render log so you can sign in without an SMS provider.
      # Anyone who can read your Render logs can read OTPs. Set to "false" (or delete) once a real SMS provider is connected.
      - key: ALLOW_DEV_OTP_IN_LOGS
        value: "true"
      - key: LOG_LEVEL
        value: INFO
