# Render Blueprint: three environments, each deployed automatically from its own Git branch.
#
#   git branch   Render service              APP_ENV       Neon database branch   deploys
#   dev          udhaarsaathi-api-dev        development   development            on every push
#   staging      udhaarsaathi-api-staging    staging       staging                after GitHub checks (tests) pass
#   main         udhaarsaathi-api            production    production             after GitHub checks (tests) pass
#
# The "test" environment is GitHub Actions (.github/workflows/ci.yml): the test suite runs on every push and pull request.
# Dashboard -> New -> Blueprint -> pick this repo. See DEPLOY_RENDER.md.
# Start-up speed (free plan wakes a sleeping service in about a minute): migrations run during the BUILD, not on every start,
# and one gunicorn worker with 4 threads boots faster and uses less memory than two workers. See DEPLOY_RENDER.md, "Cold starts".
services:
  - type: web
    name: udhaarsaathi-api-dev
    runtime: python
    plan: free
    region: singapore
    branch: dev
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --worker-class gthread --timeout 60 --access-logfile -
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: development
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL         # paste the development Neon connection string (render-secrets.local.txt)
        sync: false
      - key: PAYMENT_GATEWAY
        value: razorpay
      - key: RAZORPAY_KEY_ID      # use Razorpay TEST keys here except in production
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: OTP_SENDER
        value: console
      - key: ALLOW_DEV_OTP_IN_LOGS   # TEST ONLY: OTPs are printed in the Render log (no SMS provider yet)
        value: "true"
      - key: EMAIL_HOST_USER      # website email (SMTP, with the Gmail API as the fallback on Render's free plan)
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID     # Google Drive documents + Gmail API
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: LOG_LEVEL
        value: INFO
  - type: web
    name: udhaarsaathi-api-staging
    runtime: python
    plan: free
    region: singapore
    branch: staging
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
